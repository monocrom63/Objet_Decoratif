openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Objet Décoratif orders and account API
servers:
  - url: /api
tags:
  - name: health
  - name: account
  - name: orders
  - name: admin
  - name: catalog
  - name: Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /me:
    get:
      operationId: getMe
      tags: [account]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: Not authenticated }
  /orders:
    get:
      operationId: listMyOrders
      tags: [orders]
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { description: Not authenticated }
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { description: Invalid order }
        "401": { description: Not authenticated }
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "403": { description: Admin only }
  /admin/orders/{id}:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { description: Admin only }
        "404": { description: Order not found }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      responses:
        "200":
          description: All customer and admin accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "403": { description: Admin only }
  /catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      responses:
        "200":
          description: Published storefront catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
  /admin/catalog/initialize:
    post:
      operationId: initializeCatalog
      tags: [admin]
      description: Import the original store catalog only when both catalog tables are empty. Existing records are never replaced.
      responses:
        "201": { description: Catalog initialized, content: { application/json: { schema: { $ref: "#/components/schemas/Catalog" } } } }
        "403": { description: Admin access required }
        "409": { description: Catalog is not empty }
  /admin/catalog/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      responses:
        "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } }
    post:
      operationId: createProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
  /admin/catalog/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
    delete:
      operationId: deleteProduct
      tags: [admin]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /admin/catalog/scents:
    get:
      operationId: listAdminScents
      tags: [admin]
      responses:
        "200": { description: Scents, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Scent" } } } } }
    post:
      operationId: createScent
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScentInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Scent" } } } }
  /admin/catalog/scents/{id}:
    patch:
      operationId: updateScent
      tags: [admin]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScentUpdate" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Scent" } } } }
    delete:
      operationId: deleteScent
      tags: [admin]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted } }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200": { description: Upload URL, content: { application/json: { schema: { $ref: "#/components/schemas/UploadUrlResponse" } } } }
  /storage/uploads/discard:
    post:
      operationId: discardUpload
      tags: [Storage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoredObjectPath" }
      responses:
        "204": { description: Upload discarded or already absent }
        "409": { description: Upload is referenced by the catalog }
  /admin/storage/cleanup-unused-images:
    post:
      operationId: cleanupUnusedImages
      tags: [admin, Storage]
      responses:
        "200": { description: Cleanup result, content: { application/json: { schema: { $ref: "#/components/schemas/StorageCleanupResult" } } } }
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [Storage]
      parameters: [{ in: path, name: filePath, required: true, schema: { type: string } }]
      responses: { "200": { description: Public object } }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [Storage]
      parameters: [{ in: path, name: objectPath, required: true, schema: { type: string } }]
      responses: { "200": { description: Object } }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status, catalogUploadCleanup]
      properties:
        status: { type: string, enum: [ok, degraded] }
        catalogUploadCleanup:
          type: object
          required: [status, consecutiveFailures, latestCounts, lastSuccessAt, lastFailureAt, lastFailureMessage]
          properties:
            status: { type: string, enum: [ok, degraded] }
            consecutiveFailures: { type: integer, minimum: 0 }
            latestCounts: { $ref: "#/components/schemas/StorageCleanupResult" }
            lastSuccessAt: { type: ["string", "null"], format: date-time }
            lastFailureAt: { type: ["string", "null"], format: date-time }
            lastFailureMessage: { type: ["string", "null"] }
    StoredObjectPath:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
    StorageCleanupResult:
      type: object
      required: [scanned, deleted, retained]
      properties:
        scanned: { type: integer }
        deleted: { type: integer }
        retained: { type: integer }
    Account:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: ["string", "null"] }
        role: { type: string, enum: [admin, customer] }
    AdminUser:
      allOf:
        - { $ref: "#/components/schemas/Account" }
        - type: object
          required: [orderCount, totalSpent, createdAt]
          properties:
            orderCount: { type: integer }
            totalSpent: { type: number }
            createdAt: { type: string, format: date-time }
    OrderItemInput:
      type: object
      required: [productId, name, scent, quantity, unitPrice]
      properties:
        productId: { type: string }
        name: { type: string }
        scent: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
    OrderInput:
      type: object
      required: [email, phone, firstName, lastName, address, postalCode, city, country, paymentMethod, items]
      properties:
        guest: { type: boolean, default: false, description: "Place an order without creating or linking a user account." }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, minLength: 6, maxLength: 40 }
        firstName: { type: string }
        lastName: { type: string }
        company: { type: string }
        address: { type: string }
        apartment: { type: string }
        postalCode: { type: string }
        city: { type: string }
        country: { type: string }
        paymentMethod: { type: string, enum: [card, paypal, klarna, manual] }
        cardLastFour: { type: ["string", "null"], pattern: "^[0-9]{4}$" }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/OrderItemInput" }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [new, processing, shipped, completed, cancelled] }
    OrderItem:
      allOf:
        - { $ref: "#/components/schemas/OrderItemInput" }
        - type: object
          required: [id, lineTotal]
          properties:
            id: { type: integer }
            lineTotal: { type: number }
    Order:
      type: object
      required: [id, orderNumber, customerEmail, customerName, phone, address, paymentMethod, status, subtotal, shipping, total, createdAt, items, isGuest]
      properties:
        isGuest: { type: boolean }
        id: { type: integer }
        orderNumber: { type: string }
        customerEmail: { type: string, format: email }
        customerName: { type: string }
        phone: { type: string }
        address: { type: string }
        paymentMethod: { type: string }
        status: { type: string, enum: [new, processing, shipped, completed, cancelled] }
        subtotal: { type: number }
        shipping: { type: number }
        total: { type: number }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    Scent:
      type: object
      required: [id, name, notes, description, imagePath, active, published, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        notes: { type: string }
        description: { type: string }
        imagePath: { type: ["string", "null"] }
        showcaseMediaPath: { type: ["string", "null"] }
        active: { type: boolean }
        published: { type: boolean }
        sortOrder: { type: integer }
    ScentInput:
      type: object
      required: [id, name, notes, description]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string }
        notes: { type: string }
        description: { type: string }
        imagePath: { type: ["string", "null"] }
        showcaseMediaPath: { type: ["string", "null"] }
        active: { type: boolean }
        published: { type: boolean }
        sortOrder: { type: integer }
    ScentUpdate:
      type: object
      properties:
        name: { type: string }
        notes: { type: string }
        description: { type: string }
        imagePath: { type: ["string", "null"] }
        showcaseMediaPath: { type: ["string", "null"] }
        active: { type: boolean }
        published: { type: boolean }
        sortOrder: { type: integer }
    Product:
      type: object
      required: [id, name, collection, category, description, explanation, priceCents, tag, active, published, sortOrder, imagePaths, scentIds]
      properties:
        id: { type: string }
        name: { type: string }
        collection: { type: string }
        category: { type: string }
        description: { type: string }
        explanation: { type: string }
        priceCents: { type: integer, minimum: 0 }
        tag: { type: ["string", "null"] }
        active: { type: boolean }
        published: { type: boolean }
        sortOrder: { type: integer }
        imagePaths: { type: array, items: { type: string } }
        scentIds: { type: array, items: { type: string } }
    ProductInput:
      type: object
      required: [id, name, collection, category, description, explanation, priceCents, imagePaths, scentIds]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string }
        collection: { type: string }
        category: { type: string }
        description: { type: string }
        explanation: { type: string }
        priceCents: { type: integer, minimum: 0 }
        tag: { type: ["string", "null"] }
        active: { type: boolean }
        published: { type: boolean }
        sortOrder: { type: integer }
        imagePaths: { type: array, items: { type: string } }
        scentIds: { type: array, items: { type: string } }
    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        collection: { type: string }
        category: { type: string }
        description: { type: string }
        explanation: { type: string }
        priceCents: { type: integer, minimum: 0 }
        tag: { type: ["string", "null"] }
        active: { type: boolean }
        published: { type: boolean }
        sortOrder: { type: integer }
        imagePaths: { type: array, items: { type: string } }
        scentIds: { type: array, items: { type: string } }
    Catalog:
      type: object
      required: [products, scents]
      properties:
        products: { type: array, items: { $ref: "#/components/schemas/Product" } }
        scents: { type: array, items: { $ref: "#/components/schemas/Scent" } }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }